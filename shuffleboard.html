<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shuffleboard — Corner Pocket Arcade</title>
<link rel="icon" type="image/png" href="Cornerpocket.PNG">
<link rel="apple-touch-icon" href="Cornerpocket.PNG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shuffleboard">
<meta name="theme-color" content="#0d0b09">
<link rel="stylesheet" href="shared.css">
<style>
  /* Tightened spacing (page-specific, doesn't affect other games) so the whole
     board + every control fits on one screen with no scrolling required. */
  header { margin-bottom: 4px; }
  .stats-bar { margin-bottom: 6px; }
  .stat-chip { padding: 5px 4px; }
  .stat-chip .num { font-size: 15px; }
  .scoreboard { margin-bottom: 6px; }
  .score-panel { padding: 6px 10px; }
  #message { margin-top: 6px; font-size: 12px; min-height: 14px; }
  #powerWrap { margin-top: 6px; }
  #aimPadWrap { margin-top: 8px; }
  #aimPad { max-width: 120px; max-height: 120px; min-width: 100px; min-height: 100px; }
  #aimPadLabel { margin-top: 4px; font-size: 10.5px; }
  .help { margin-top: 8px; font-size: 10px; line-height: 1.4; }
  #appVersion { margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <a class="icon-btn fixed-corner left" href="index.html" aria-label="Back to arcade">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 5l-7 7 7 7" stroke="#e9d9a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <button class="icon-btn fixed-corner right" id="settingsBtn" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="#e9d9a8" stroke-width="1.6"/>
      <path d="M19.4 13.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.02-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.38.96a7.4 7.4 0 0 0-1.73-1l-.36-2.53a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.53a7.4 7.4 0 0 0-1.73 1l-2.38-.96a.5.5 0 0 0-.6.22L2.62 9.28a.5.5 0 0 0 .12.64L4.76 11.5c-.04.33-.06.66-.06 1s.02.67.06 1L2.74 15.08a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.38-.96c.53.43 1.11.77 1.73 1l.36 2.53a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.53a7.4 7.4 0 0 0 1.73-1l2.38.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13.5Z" stroke="#e9d9a8" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </button>

  <header><h1>Shuffleboard</h1></header>

  <div class="stats-bar">
    <div class="stat-chip wins"><span class="num" id="statWins">0</span><span class="lbl">Wins</span></div>
    <div class="stat-chip losses"><span class="num" id="statLosses">0</span><span class="lbl">Losses</span></div>
    <div class="stat-chip rate"><span class="num" id="statRate">—</span><span class="lbl">Win Rate</span></div>
  </div>

  <div id="settingsModal">
    <div id="settingsModalCard">
      <div class="settingsModalHeader">
        <span>Settings</span>
        <button id="settingsCloseBtn" aria-label="Close">&times;</button>
      </div>
      <label for="difficulty">Computer skill</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="resetStats">Reset record</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="score-panel" id="playerPanel">
      <span class="who"><span class="dot"></span>YOU</span>
      <span class="sub" id="playerScore">Score: 0</span>
    </div>
    <div class="score-panel" id="aiPanel">
      <span class="who"><span class="dot"></span>COMPUTER</span>
      <span class="sub" id="aiScore">Score: 0</span>
    </div>
  </div>

  <div id="tableWrap">
    <canvas id="table" width="360" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlayText">Details here</p>
      <button class="primary" onclick="startMatch()">Play Again</button>
    </div>
  </div>

  <div id="message">Loading...</div>
  <div id="powerWrap"><div id="powerBar"></div></div>

  <div id="aimPadWrap">
    <div id="aimPad"><div id="aimKnob"></div></div>
    <div id="aimPadLabel">Drag puck sideways to aim, pad to shoot</div>
  </div>

  <div class="help">
    4 pucks each per end. Only the closer player's leading pucks score. First to 21 wins.
  </div>

  <div id="appVersion">v1.1.4</div>
</div>

<script src="shared.js"></script>
<script>
(function(){
  "use strict";

  // ---------- CONFIG ----------
  const CW = 360, CH = 400;
  const LANE_LEFT = 64, LANE_RIGHT = CW - 64;
  const PUCK_R = 13;
  const FRICTION = 0.99;
  const STOP_SPEED = 0.05;
  const MAX_SPEED = 6;

  const LANE_START_Y = 370;   // where a fresh puck is placed to be shot
  const BOTTOM_DEAD_Y = 389;  // knocked back past here = off the near end
  const FOUL_LINE_Y = 316;    // must cross this to score anything
  const ZONE1_END_Y = 262;    // [262,316) = zone 1
  const ZONE2_END_Y = 208;    // [208,262) = zone 2
  const ZONE3_END_Y = 154;    // [154,208) = zone 3
  const ZONE4_END_Y = 89;     // [89,154) = zone 4 ("hanging")
  const OFF_EDGE_Y = 89;      // below this = fell off the far edge

  const WIN_SCORE = 21;

  function zoneForY(y){
    if(y >= FOUL_LINE_Y) return 0;
    if(y >= ZONE1_END_Y) return 1;
    if(y >= ZONE2_END_Y) return 2;
    if(y >= ZONE3_END_Y) return 3;
    if(y >= ZONE4_END_Y) return 4;
    return 0;
  }

  // ---------- STATS ----------
  const stats = Arcade.createStats('shuffleboard_stats_v1');
  const statWinsEl = document.getElementById('statWins');
  const statLossesEl = document.getElementById('statLosses');
  const statRateEl = document.getElementById('statRate');
  function renderStats(){ stats.render(statWinsEl, statLossesEl, statRateEl); }
  document.getElementById('resetStats').addEventListener('click', () => {
    if(confirm('Reset your win/loss record?')){ stats.reset(); renderStats(); }
  });
  renderStats();
  Arcade.wireSettingsModal('settingsBtn', 'settingsModal', 'settingsCloseBtn');

  // ---------- STATE ----------
  let pucks = [];           // all pucks thrown this end (both players)
  let activePuck = null;    // the puck currently live/ready to be shot
  let shotsThisEnd = 0;     // 0..8
  let startingPlayer = 'player';
  let turn = 'player';
  let state = 'aiming';     // 'aiming' | 'rolling' | 'ai-wait' | 'over'
  let playerScore = 0, aiScore = 0;
  let gameOver = false;

  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');
  const messageEl = document.getElementById('message');
  const powerBar = document.getElementById('powerBar');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const playerPanel = document.getElementById('playerPanel');
  const aiPanel = document.getElementById('aiPanel');
  const playerScoreEl = document.getElementById('playerScore');
  const aiScoreEl = document.getElementById('aiScore');
  const difficultySel = document.getElementById('difficulty');
  const aimPad = document.getElementById('aimPad');
  const aimKnob = document.getElementById('aimKnob');

  function setMessage(t){ messageEl.textContent = t; }

  function laneCenterX(){ return (LANE_LEFT + LANE_RIGHT) / 2; }

  function makePuck(owner){
    return { owner, x: laneCenterX(), y: LANE_START_Y, vx: 0, vy: 0, r: PUCK_R, dead: false, resting: true };
  }

  function whoseShotIndex(i){
    // shots alternate starting with startingPlayer
    const startsWithStarting = (i % 2 === 0);
    if(startsWithStarting) return startingPlayer;
    return startingPlayer === 'player' ? 'ai' : 'player';
  }

  function startMatch(){
    playerScore = 0; aiScore = 0;
    gameOver = false;
    overlay.style.display = 'none';
    startingPlayer = Math.random() < 0.5 ? 'player' : 'ai';
    startEnd();
  }

  function startEnd(){
    pucks = [];
    shotsThisEnd = 0;
    updateScorePanels();
    beginNextShot();
  }

  function beginNextShot(){
    if(shotsThisEnd >= 8){
      resolveEnd();
      return;
    }
    turn = whoseShotIndex(shotsThisEnd);
    activePuck = makePuck(turn);
    pucks.push(activePuck);
    updatePanels();
    if(turn === 'player'){
      state = 'aiming';
      setMessage("Your shot — drag the pad to slide your puck.");
    } else {
      state = 'ai-wait';
      setMessage("Computer is lining up a shot...");
      setTimeout(aiTakeShot, 800);
    }
    render();
  }

  // ---------- AIM PAD ----------
  function canShoot(){
    return turn === 'player' && state === 'aiming' && !gameOver && allStopped();
  }
  Arcade.createAimPad({
    padEl: aimPad, knobEl: aimKnob, powerBarEl: powerBar,
    canShoot: canShoot,
    onRelease: (dx, dy, power) => {
      // pull-back convention: dx,dy is the pull direction; fire opposite.
      fireActive(-dx * power * MAX_SPEED, -dy * power * MAX_SPEED);
    }
  });

  function fireActive(vx, vy){
    if(!activePuck) return;
    activePuck.vx = vx; activePuck.vy = vy;
    activePuck.resting = false;
    state = 'rolling';
  }

  // ---------- PUCK PLACEMENT: drag horizontally to set up different shot angles ----------
  function canRepositionPuck(){
    return canShoot() && !!activePuck;
  }
  function canvasCoords(evt){
    const rect = canvas.getBoundingClientRect();
    const t = evt.touches ? evt.touches[0] : evt;
    const scaleX = CW / rect.width;
    return { x: (t.clientX - rect.left) * scaleX };
  }
  let repositioning = false;
  function puckDown(evt){
    if(!canRepositionPuck()) return;
    evt.preventDefault();
    repositioning = true;
    updatePuckX(evt);
  }
  function puckMove(evt){
    if(!repositioning) return;
    evt.preventDefault();
    updatePuckX(evt);
  }
  function puckUp(evt){
    if(!repositioning) return;
    repositioning = false;
    evt.preventDefault();
  }
  function updatePuckX(evt){
    const p = canvasCoords(evt);
    activePuck.x = Math.min(LANE_RIGHT - PUCK_R, Math.max(LANE_LEFT + PUCK_R, p.x));
    render();
  }
  canvas.addEventListener('pointerdown', puckDown);
  window.addEventListener('pointermove', puckMove);
  window.addEventListener('pointerup', puckUp);
  canvas.addEventListener('touchstart', puckDown, { passive: false });
  window.addEventListener('touchmove', puckMove, { passive: false });
  window.addEventListener('touchend', puckUp, { passive: false });

  // ---------- PHYSICS ----------
  function allStopped(){
    return pucks.every(p => p.dead || p.resting);
  }

  function stepPhysics(){
    pucks.forEach(p => {
      if(p.dead || p.resting) return;
      p.x += p.vx; p.y += p.vy;
      p.vx *= FRICTION; p.vy *= FRICTION;
      if(Math.hypot(p.vx, p.vy) < STOP_SPEED){ p.vx = 0; p.vy = 0; p.resting = true; }

      if(p.x < LANE_LEFT || p.x > LANE_RIGHT){ p.dead = true; p.vx = 0; p.vy = 0; }
      if(p.y < OFF_EDGE_Y){ p.dead = true; p.vx = 0; p.vy = 0; }
      if(p.y > BOTTOM_DEAD_Y){ p.dead = true; p.vx = 0; p.vy = 0; }
    });

    for(let i=0;i<pucks.length;i++){
      if(pucks[i].dead) continue;
      for(let j=i+1;j<pucks.length;j++){
        if(pucks[j].dead) continue;
        const a = pucks[i], b = pucks[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.hypot(dx,dy);
        const minDist = a.r+b.r;
        if(dist > 0 && dist < minDist){
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minDist-dist)/2;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          a.resting = false; b.resting = false;
          const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
          const velAlongNormal = rvx*nx + rvy*ny;
          if(velAlongNormal < 0){
            const restitution = 0.9;
            const impulse = -(1+restitution)*velAlongNormal/2;
            a.vx -= impulse*nx; a.vy -= impulse*ny;
            b.vx += impulse*nx; b.vy += impulse*ny;
          }
        }
      }
    }
  }

  function resolveIfSettled(){
    if(state !== 'rolling') return;
    if(!allStopped()) return;

    shotsThisEnd++;
    activePuck = null;

    if(shotsThisEnd >= 8){
      setMessage("End complete — tallying score...");
      setTimeout(resolveEnd, 700);
      state = 'ai-wait'; // block input during the pause
    } else {
      beginNextShot();
    }
  }

  function resolveEnd(){
    const alive = pucks.filter(p => !p.dead && zoneForY(p.y) > 0)
      .map(p => ({ owner: p.owner, dist: LANE_START_Y - p.y, zone: zoneForY(p.y) }))
      .sort((a,b) => b.dist - a.dist); // farthest first

    let leadGain = 0, leader = null;
    if(alive.length > 0){
      leader = alive[0].owner;
      let cutoff = alive.length;
      for(let i=1;i<alive.length;i++){
        if(alive[i].owner !== leader){ cutoff = i; break; }
      }
      for(let i=0;i<cutoff;i++) leadGain += alive[i].zone;
    }

    if(leader === 'player') playerScore += leadGain;
    else if(leader === 'ai') aiScore += leadGain;

    updateScorePanels();

    if(playerScore >= WIN_SCORE || aiScore >= WIN_SCORE){
      const winner = playerScore >= WIN_SCORE ? 'player' : 'ai';
      endMatch(winner);
      return;
    }

    setMessage(leader ? `${leader === 'player' ? 'You' : 'Computer'} scored ${leadGain} this end.` : "No one scored that end.");
    startingPlayer = startingPlayer === 'player' ? 'ai' : 'player';
    setTimeout(startEnd, 1200);
  }

  function endMatch(winner){
    gameOver = true;
    state = 'over';
    overlay.style.display = 'flex';
    overlayTitle.textContent = winner === 'player' ? "You Win" : "Computer Wins";
    overlayText.textContent = `Final score: ${playerScore} – ${aiScore}`;
    if(winner === 'player') stats.addWin(); else stats.addLoss();
    renderStats();
    updatePanels();
  }

  function updateScorePanels(){
    playerScoreEl.textContent = `Score: ${playerScore}`;
    aiScoreEl.textContent = `Score: ${aiScore}`;
  }
  function updatePanels(){
    playerPanel.classList.toggle('active', turn === 'player' && !gameOver);
    aiPanel.classList.toggle('active', turn === 'ai' && !gameOver);
  }

  // ---------- AI ----------
  function aiTakeShot(){
    if(gameOver) return;
    const diff = difficultySel.value;
    const errorPx = diff==='easy' ? 23 : diff==='hard' ? 5 : 11;
    const powerNoise = diff==='easy' ? 0.20 : diff==='hard' ? 0.04 : 0.11;

    // figure out if the opponent currently holds the lead and is worth knocking
    const alive = pucks.filter(p => p !== activePuck && !p.dead && zoneForY(p.y) > 0)
      .map(p => ({ p, dist: LANE_START_Y - p.y }))
      .sort((a,b) => b.dist - a.dist);

    let target;
    if(alive.length > 0 && alive[0].p.owner === 'player'){
      // knock the opponent's leading puck
      target = { x: alive[0].p.x, y: alive[0].p.y - 8 }; // aim slightly past its center for a clean hit through
    } else {
      // lay up in the best zone (aim for the hang zone, with a little room to spare)
      target = { x: laneCenterX() + (Math.random()*2-1)*14, y: ZONE4_END_Y + 31 };
    }

    target.x += (Math.random()*2-1) * errorPx;
    target.y += (Math.random()*2-1) * errorPx * 0.6;

    const start = activePuck;
    const dx = target.x - start.x, dy = target.y - start.y;
    const dist = Math.hypot(dx, dy);
    const ux = dist > 0 ? dx/dist : 0, uy = dist > 0 ? dy/dist : -1;

    let v0 = dist * (1 - FRICTION);
    v0 *= (1 + (Math.random()*2-1) * powerNoise);
    v0 = Math.max(1.5, Math.min(MAX_SPEED, v0));

    fireActive(ux*v0, uy*v0);
  }

  // ---------- RENDER ----------
  function render(){
    ctx.clearRect(0,0,CW,CH);

    // lane background
    const wood = ctx.createLinearGradient(0,0,0,CH);
    wood.addColorStop(0,'#5a3d24'); wood.addColorStop(1,'#33220f');
    ctx.fillStyle = wood; ctx.fillRect(0,0,CW,CH);

    const lane = ctx.createLinearGradient(0,0,0,CH);
    lane.addColorStop(0,'#caa15a'); lane.addColorStop(1,'#a97e3c');
    ctx.fillStyle = lane;
    ctx.fillRect(LANE_LEFT, 0, LANE_RIGHT-LANE_LEFT, CH);

    // gutters (visual only)
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(LANE_LEFT-14, 0, 14, CH);
    ctx.fillRect(LANE_RIGHT, 0, 14, CH);

    // zone bands + labels
    drawZone(FOUL_LINE_Y, ZONE1_END_Y, '1', 'rgba(255,255,255,0.05)');
    drawZone(ZONE1_END_Y, ZONE2_END_Y, '2', 'rgba(255,255,255,0.09)');
    drawZone(ZONE2_END_Y, ZONE3_END_Y, '3', 'rgba(255,255,255,0.13)');
    drawZone(ZONE3_END_Y, ZONE4_END_Y, '4', 'rgba(212,175,106,0.28)');

    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(LANE_LEFT, FOUL_LINE_Y); ctx.lineTo(LANE_RIGHT, FOUL_LINE_Y); ctx.stroke();
    ctx.setLineDash([]);

    // far edge
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(LANE_LEFT, OFF_EDGE_Y); ctx.lineTo(LANE_RIGHT, OFF_EDGE_Y); ctx.stroke();

    pucks.forEach(p => { if(!p.dead) drawPuck(p); });

    if(canRepositionPuck()){
      ctx.save();
      ctx.setLineDash([4,4]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(212,175,106,0.9)';
      ctx.beginPath();
      ctx.arc(activePuck.x, activePuck.y, PUCK_R+6, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawZone(yFrom, yTo, label, fill){
    ctx.fillStyle = fill;
    ctx.fillRect(LANE_LEFT, yTo, LANE_RIGHT-LANE_LEFT, yFrom-yTo);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(label, LANE_RIGHT-18, (yFrom+yTo)/2 + 4);
  }

  function drawPuck(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.beginPath(); ctx.ellipse(1,2,p.r*0.95,p.r*0.8,0,0,Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();

    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2);
    ctx.fillStyle = p.owner === 'player' ? '#d4af6a' : '#8a2f2f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.beginPath(); ctx.arc(0,0,p.r*0.55,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // ---------- GAME LOOP ----------
  function loop(){
    if(state === 'rolling'){
      stepPhysics();
      render();
      resolveIfSettled();
    } else {
      render();
    }
    aimPad.classList.toggle('disabled', !canShoot());
    requestAnimationFrame(loop);
  }

  window.startMatch = startMatch;
  startMatch();
  requestAnimationFrame(loop);
})();
</script>
<script>
  Arcade.registerServiceWorker();
</script>
</body>
</html>
